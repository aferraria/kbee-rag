server:
  port: 8081

logging:
  level:
    kbee.rag.thesaurus.ThesaursService: DEBUG
  
spring:
  security:
    user:
      name: admin
      password: kbeerag
  mvc:
    async:
      request-timeout: 9000000  
solr:
  source:
    base-url: http://localhost:8087/solr
    core: aacontent
    # Basic auth (leave username empty to disable authentication)
    username: ${SOLR_SOURCE_USERNAME:}
    password: ${SOLR_SOURCE_PASSWORD:}
 
  target:
    base-url: http://localhost:8983/solr
    core: kbee_segments
    # Basic auth (leave username empty to disable authentication)
    username: ${SOLR_TARGET_USERNAME:}
    password: ${SOLR_TARGET_PASSWORD:}

rag:
  prompts:
    rerank: rerank-qwen14
    rerank-final: rerank-final
    answer: rag-answer
    thesaurus: thesaurus
    propositions: legal
    enrichment:
       segment: segment-enrichment
       segment-batch: segment-batch-enrichment
       question: question-enrichment
  
embedding:
  provider: qwen-local
  dimension: 1024
  
  qwen-local:
    base-url: http://localhost:11434
    model: qwen3-embedding:0.6b
    connection-timeout-ms: 5000
    request-timeout-ms: 120000

  local-multilingual:
    base-url: http://localhost:8090
    connection-timeout-ms: 5000
    request-timeout-ms: 120000

  local:
    model: all-minilm-l6-v2-q

  huggingface:
    access-token: ${HF_TOKEN}
    model-id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    base-url: https://router.huggingface.co/hf-inference/models
    connection-timeout-ms: 10000
    request-timeout-ms: 220000

vector-search:
  embedding-field: embedding

segment-indexer:
  enabled: false

  source-query: 'type:"idoc" AND head:"true" AND portaltext:[* TO *]'
  source-id-field: id
  source-text-field: portaltext

  source-start: 0
  source-max-ids: 4000
  source-page-size: 10

  segment-size: 1500
  segment-overlap: 0

  embedding-batch-size: 5
  indexing-batch-size: 100

  commit-every-documents: 50

llm:
  # Default provider used when the client does not send "llm" in the request.
  # Available: ollama | openai | claude | openrouter
  provider: openai

  ollama:
    enabled: true
    base-url: http://localhost:11434
    model: qwen3.5:latest
    connection-timeout-ms: 90000
    request-timeout-ms: 9000000

  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6
    base-url: https://api.openai.com/v1
    connection-timeout-ms: 10000
    request-timeout-ms: 120000

  claude:
    enabled: false
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-5
    base-url: https://api.anthropic.com/v1
    max-tokens: 8192
    connection-timeout-ms: 10000
    request-timeout-ms: 300000

  # Qwen via OpenRouter (or MindsHub: change base-url/model accordingly)
  openrouter:
    enabled: true
    api-key: ${OPENROUTER_API_KEY:}
    model: qwen/qwen3-235b-a22b
    base-url: https://openrouter.ai/api/v1
    referer: https://demo.kbee.io
    title: KBEE RAG
    connection-timeout-ms: 10000
    request-timeout-ms: 300000

llm-test:
  enabled: false
  
reranker:
   provider: local-qwen

   enabled: true
   base-url: http://localhost:8091
   connection-timeout-ms: 5000
   request-timeout-ms: 9000000
   candidate-count: 50
   top-k: 5  
   
judicial-indexer:
   enabled: false

   directory: fallos

   segment-size: 1500
   segment-overlap: 0

   embedding-batch-size: 32
   indexing-batch-size: 100

   commit-every-documents: 100